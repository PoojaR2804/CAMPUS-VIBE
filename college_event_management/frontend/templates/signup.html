
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusVibe - Signup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    
<style>
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        padding: 20px;
        position: relative;
        overflow-x: hidden;
        background: #1e293b;
    }

    /* Campus background image with blur */
    body::before {
        content: "";
        position: fixed;
        inset: -10px;
        background-image: url("https://i.pinimg.com/1200x/d0/38/b7/d038b7c7aa23d5ae9f506456ed6fdd72.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(5px) brightness(0.6);
        transform: scale(1.03);
        z-index: -2;
    }

    /* Dark overlay */
    body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.25);
        z-index: -1;
    }

    /* Signup card */
    .signup-card {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.96);
        width: 100%;
        max-width: 480px;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(8px);
    }

    .brand {
        color: #6c63ff;
        font-weight: bold;
        font-size: 28px;
        text-align: center;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    .form-control,
    .form-select {
        padding: 11px;
        border-radius: 8px;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #6c63ff;
        box-shadow: 0 0 0 0.2rem rgba(108, 99, 255, 0.2);
    }

    .btn-signup {
        background: #6c63ff;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-weight: bold;
        transition: 0.3s ease;
    }

    .btn-signup:hover {
        background: #5548d9;
        color: white;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(108, 99, 255, 0.3);
    }

    .login-link {
        text-align: center;
        margin-top: 20px;
    }

    .login-link a {
        color: #6c63ff;
        font-weight: bold;
        text-decoration: none;
    }

    .login-link a:hover {
        text-decoration: underline;
    }

    @media (max-width: 576px) {
        .signup-card {
            padding: 25px 20px;
        }
    }
</style>
</head>

<body>

    <div class="signup-card">

        <div class="brand">CampusVibe</div>
        <p class="subtitle">Create your student account</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close"
                                data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('signup') }}">

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control"
                       placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control"
                       placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Register Number</label>
                <input type="text" name="register_no" class="form-control"
                       placeholder="Enter your register number" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Department</label>
                <select name="department" class="form-select" required>
                    <option value="">Select Department</option>
                    <option value="CSE">Computer Science Engineering</option>
                    <option value="IT">Information Technology</option>
                    <option value="ECE">Electronics and Communication</option>
                    <option value="EEE">Electrical and Electronics</option>
                    <option value="MECH">Mechanical Engineering</option>
                    <option value="CIVIL">Civil Engineering</option>
                    <option value="AI & DS">AI & Data Science</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Create a password" required minlength="8">
            </div>

            <button type="submit" class="btn btn-signup w-100">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </div>

        <div class="text-center mt-3">
            <a href="{{ url_for('home') }}" class="text-secondary">
                Back to Home
            </a>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
